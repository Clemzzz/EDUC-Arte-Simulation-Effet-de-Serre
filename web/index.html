<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EDUC'Arte — Effet de serre</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="container">
    <header class="topbar">
      <div class="brand">
        <span class="eyebrow">Station ESP32 • Cloche expérimentale</span>
        <h1>EDUC'Arte</h1>
        <p class="subtitle">Suivi en temps réel de l'effet de serre</p>
      </div>

      <div class="status-pill badge-neutral" id="mode-badge" role="status" aria-atomic="true">
        <span class="status-dot" aria-hidden="true"></span>
        <span id="mode-text">Connexion…</span>
      </div>
    </header>

    <section class="metrics" aria-label="Mesures en temps réel">
      <article class="card metric metric-temp">
        <div class="metric-head">
          <span class="metric-label">Température</span>
          <span class="icon-wrap icon-temp" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z" />
            </svg>
          </span>
        </div>
        <div class="metric-value">
          <span id="temp-value">--.-</span><span class="metric-unit">°C</span>
        </div>
      </article>

      <article class="card metric metric-hum">
        <div class="metric-head">
          <span class="metric-label">Humidité</span>
          <span class="icon-wrap icon-hum" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z" />
            </svg>
          </span>
        </div>
        <div class="metric-value">
          <span id="hum-value">--.-</span><span class="metric-unit">%</span>
        </div>
      </article>

      <article class="card metric metric-time">
        <div class="metric-head">
          <span class="metric-label">Temps écoulé</span>
          <span class="icon-wrap icon-time" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9" />
              <polyline points="12 7 12 12 15.5 14" />
            </svg>
          </span>
        </div>
        <div class="metric-value">
          <span id="elapsed-value">00:00</span>
        </div>
      </article>
    </section>

    <section id="sim-panel" class="card sim-panel hidden" aria-label="Paramètres de l'expérience">
      <div class="panel-header">
        <h2>Paramètres</h2>
        <button id="btn-reset" type="button" class="btn btn-ghost">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="1 4 1 10 7 10" />
            <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10" />
          </svg>
          <span>Réinitialiser</span>
        </button>
      </div>

      <div class="controls">
        <div class="control">
          <span class="control-label" id="lbl-lamp">Lampe (soleil)</span>
          <button
            id="btn-lamp"
            type="button"
            class="btn btn-toggle active"
            aria-labelledby="lbl-lamp"
            aria-pressed="true"
          >
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
            </svg>
            <span id="lamp-state">Allumée</span>
          </button>
        </div>

        <div class="control">
          <span class="control-label" id="lbl-paper">Papier humide</span>
          <button
            id="btn-paper"
            type="button"
            class="btn btn-toggle active"
            aria-labelledby="lbl-paper"
            aria-pressed="true"
          >
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z" />
            </svg>
            <span id="paper-state">Présent</span>
          </button>
        </div>

        <div class="control">
          <span class="control-label" id="lbl-speed">Vitesse</span>
          <div class="speed-group" role="group" aria-labelledby="lbl-speed">
            <button type="button" class="btn btn-speed active" data-speed="1" aria-pressed="true">×1</button>
            <button type="button" class="btn btn-speed" data-speed="10" aria-pressed="false">×10</button>
            <button type="button" class="btn btn-speed" data-speed="60" aria-pressed="false">×60</button>
          </div>
        </div>
      </div>
    </section>

    <div class="download-row">
      <a
        id="btn-download-csv"
        href="/api/export.csv"
        download="educarte_effet_de_serre.csv"
        class="btn btn-primary"
      >
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
          <polyline points="7 10 12 15 17 10" />
          <line x1="12" y1="15" x2="12" y2="3" />
        </svg>
        <span>Télécharger les données (.csv)</span>
      </a>
    </div>
  </main>

  <script src="/app.js"></script>
</body>
</html>
